name: Publish Mock Server to GHCR

on:
  release:
    types: [published]
  workflow_dispatch: # Allows you to also trigger this manually from the GitHub UI
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/qasimah-com/mock-server:latest
          # ghcr.io/qasimah-com/mock-server:${{ github.event.release.tag_name }}